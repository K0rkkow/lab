<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Forum</title></head>
<body>
<script>
var p=JSON.parse(localStorage.getItem('f')||'[]');
var h=p.map(function(x){return '<div style="background:#fff;padding:15px;margin:10px 0;border-radius:8px"><b>'+x.a+'</b><p>'+x.c+'</p></div>'}).join('');
document.write('<h1>Forum</h1><form id="f"><input id="a" placeholder="Pseudo" style="padding:8px;width:200px;margin:5px"><br><textarea id="c" placeholder="Message" style="width:300px;height:60px;padding:8px"></textarea><br><button onclick="var p=JSON.parse(localStorage.getItem(\'f\')||\'[]\');p.push({a:a.value,c:c.value});localStorage.setItem(\'f\',JSON.stringify(p));location.reload()">Publier</button></form><hr>'+h);
</script>
</body>
</html>
