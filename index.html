<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mini Forum - Lab XSS</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
  h1 { color: #333; }
  .post { background: #fff; padding: 15px; margin: 10px 0; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .post .author { font-weight: bold; color: #0066cc; }
  .post .content { margin-top: 8px; }
  textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  input[type=text] { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 10px 20px; background: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #0052a3; }
</style>
</head>
<body>
<h1>💬 Mini Forum</h1>

<form id="postForm">
  <input type="text" id="author" placeholder="Ton pseudo">
  <textarea id="content" placeholder="Ton message..."></textarea>
  <button type="submit">Publier</button>
</form>

<div id="posts"></div>

<script>
function getPosts() {
  return JSON.parse(localStorage.getItem('forum_posts') || '[]');
}

function savePosts(posts) {
  localStorage.setItem('forum_posts', JSON.stringify(posts));
}

// ⚠️ Simulation de rendu SERVEUR via document.write
// C'est comme si le serveur renvoyait l'HTML avec le contenu injecté
function renderPage() {
  const posts = getPosts();
  const postsHTML = posts.map(p =>
    `<div class="post"><span class="author">${p.author}</span><div class="content">${p.content}</div></div>`
  ).join('');

  // document.write simule une réponse serveur → les <script> S'EXÉCUTENT
  document.write(`
    <h1>💬 Mini Forum</h1>
    <form id="postForm">
      <input type="text" id="author" placeholder="Ton pseudo">
      <textarea id="content" placeholder="Ton message..."></textarea>
      <button type="submit">Publier</button>
    </form>
    <div id="posts">${postsHTML}</div>
    <script>
      document.getElementById('postForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var posts = getPosts();
        posts.push({
          author: document.getElementById('author').value,
          content: document.getElementById('content').value
        });
        savePosts(posts);
        renderPage();
      });
    <\/script>
  `);
}

function getPosts() {
  return JSON.parse(localStorage.getItem('forum_posts') || '[]');
}
function savePosts(posts) {
  localStorage.setItem('forum_posts', JSON.stringify(posts));
}

renderPage();
</script>
</body>
</html>
